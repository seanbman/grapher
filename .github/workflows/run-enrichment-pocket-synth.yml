name: Run pocket-synth enrichment study

on:
  push:
    branches: [research/enrichment-workflow-v1]
    paths: ['.github/workflows/run-enrichment-pocket-synth.yml']

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: grapher
      - uses: actions/checkout@v4
        with:
          repository: seanbman/pocket-synth
          ref: 33928620f31c70d86da9a4f9133aec897752f3f0
          path: pocket-synth
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select deterministic review slice
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          g=json.loads(Path('pocket-synth/.grapher/knowledge.json').read_text())
          nodes=g['nodes']
          ids=[]
          for t in ('decision','instruction','finding'):
              choices=sorted(k for k,v in nodes.items() if v.get('type')==t)
              if choices: ids.append(choices[0])
          Path('/tmp/ids').write_text('\n'.join(ids))
          print(ids)
          PY
      - name: Build review packet
        working-directory: grapher
        run: |
          args=()
          while IFS= read -r id; do args+=(--id "$id"); done < /tmp/ids
          python research/training-data/enrichment.py preview \
            --graph ../pocket-synth/.grapher/knowledge.json \
            "${args[@]}" \
            --out research/training-data/enrichment-studies/001-pocket-synth/preview.json
          cat > research/training-data/enrichment-studies/001-pocket-synth/README.md <<'EOF'
          # Enrichment Study 001 — pocket-synth

          Source: `seanbman/pocket-synth@33928620f31c70d86da9a4f9133aec897752f3f0`.

          Deterministic slice: first legacy `decision`, `instruction`, and `finding` records by id. `preview.json` is review-only: candidate fields remain empty and no source record is modified.
          EOF
      - name: Commit packet and remove runner
        working-directory: grapher
        run: |
          rm .github/workflows/run-enrichment-pocket-synth.yml
          git config user.name seanbman
          git config user.email seannicholasburman@gmail.com
          git add research/training-data/enrichment-studies/001-pocket-synth .github/workflows/run-enrichment-pocket-synth.yml
          git commit -m 'research: capture pocket-synth enrichment review packet'
          git push
