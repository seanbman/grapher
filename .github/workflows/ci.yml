name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce documentation index and diagrams
        run: python scripts/check_docs_index.py

      - name: Enforce Grapher self-state update
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_self_graph_update.py --base "$BASE_SHA"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Install development dependencies
        run: uv sync --extra dev --frozen

      - name: Compile package
        run: uv run python -m compileall -q src/grapher

      - name: Build package
        run: uv build

      - name: Smoke test installed CLI
        run: |
          uv run python -c "import grapher; import grapher.main"
          uv run grapher --help >/dev/null

      - name: Run tests
        run: uv run pytest

      - name: Enforce explicit truth statuses
        run: uv run python scripts/check_truth_status.py .grapher/shared/knowledge.json
