name: Complete pocket-synth enrichment review

on:
  push:
    branches: [research/enrichment-workflow-v1]
    paths: ['.github/workflows/complete-enrichment-review.yml']

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: grapher
      - uses: actions/checkout@v4
        with:
          repository: seanbman/pocket-synth
          ref: 33928620f31c70d86da9a4f9133aec897752f3f0
          path: pocket-synth
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild complete deterministic slice
        working-directory: grapher
        run: |
          python - <<'PY'
          import importlib.util, json
          from pathlib import Path
          p=Path('research/training-data/enrichment.py')
          spec=importlib.util.spec_from_file_location('enrichment',p)
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          graph=json.loads(Path('../pocket-synth/.grapher/knowledge.json').read_text())
          nodes=graph['nodes']; ids=[]
          for t in ('decision','instruction','finding'):
              choices=sorted(k for k,v in nodes.items() if v.get('type')==t)
              if choices: ids.append(choices[0])
          out=mod.preview(graph, ids)
          target=Path('research/training-data/enrichment-studies/001-pocket-synth/preview.json')
          target.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(ids)
          PY
      - name: Commit packet and remove runner
        working-directory: grapher
        run: |
          rm .github/workflows/complete-enrichment-review.yml
          git config user.name seanbman
          git config user.email seannicholasburman@gmail.com
          git add research/training-data/enrichment-studies/001-pocket-synth/preview.json .github/workflows/complete-enrichment-review.yml
          git commit -m 'research: complete pocket-synth enrichment review slice'
          git push
