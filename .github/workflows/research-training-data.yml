name: Training-data research

on:
  push:
    paths:
      - 'research/training-data/**'
      - '.github/workflows/research-training-data.yml'
  pull_request:
    paths:
      - 'research/training-data/**'
      - '.github/workflows/research-training-data.yml'

jobs:
  validate-derived-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate schema and fixtures
        run: |
          python -m pip install jsonschema
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path('research/training-data')
          schema = json.loads((root / 'schema.v1.json').read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema)
          examples = sorted((root / 'examples').glob('*.json'))
          if not examples:
              raise SystemExit('no derived-example fixtures found')
          for path in examples:
              value = json.loads(path.read_text(encoding='utf-8'))
              errors = sorted(validator.iter_errors(value), key=lambda e: list(e.path))
              if errors:
                  messages = '\n'.join(f'{path}: {list(e.path)}: {e.message}' for e in errors)
                  raise SystemExit(messages)
              print(f'valid: {path}')
          PY
