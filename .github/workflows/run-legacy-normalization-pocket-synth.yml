name: Run legacy normalization pocket-synth

on:
  push:
    paths:
      - '.github/workflows/run-legacy-normalization-pocket-synth.yml'

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: grapher
      - uses: actions/checkout@v4
        with:
          repository: seanbman/pocket-synth
          ref: 33928620f31c70d86da9a4f9133aec897752f3f0
          path: pocket-synth
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run preview
        working-directory: grapher
        run: |
          mkdir -p research/training-data/normalization-studies/001-pocket-synth
          python research/training-data/legacy_normalization.py \
            --graph ../pocket-synth/.grapher/knowledge.json \
            --source-ref 'github:seanbman/pocket-synth@33928620f31c70d86da9a4f9133aec897752f3f0:.grapher/knowledge.json' \
            --metrics research/training-data/normalization-studies/001-pocket-synth/metrics.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/training-data/normalization-studies/001-pocket-synth/metrics.json')
          m=json.loads(p.read_text())
          d=m['disposition_counts']
          text=(
            '# Legacy normalization study 001 — pocket-synth\n\n'
            'Pinned source: `seanbman/pocket-synth@33928620` `.grapher/knowledge.json`. Source is read-only.\n\n'
            f"- Nodes: {m['node_count']}\n"
            f"- Mechanically mappable: {d.get('mechanically_mappable',0)}\n"
            f"- Enrichment required: {d.get('enrichment_required',0)}\n"
            f"- Context only: {d.get('context_only',0)}\n\n"
            'Interpretation: only records that already carry a canonical semantic payload qualify as mechanically mappable. Ambiguous legacy findings/instructions and free-text semantic types require enrichment; artifacts/context remain context-only. No rationale, evidence, or semantic type is invented.\n'
          )
          Path('research/training-data/normalization-studies/001-pocket-synth/ASSESSMENT.md').write_text(text)
          PY
      - name: Commit study artifacts and remove runner
        working-directory: grapher
        run: |
          rm .github/workflows/run-legacy-normalization-pocket-synth.yml
          git config user.name 'grapher-research'
          git config user.email 'grapher-research@users.noreply.github.com'
          git add research/training-data/normalization-studies/001-pocket-synth .github/workflows/run-legacy-normalization-pocket-synth.yml
          git commit -m 'research: record legacy normalization pocket-synth baseline'
          git push
