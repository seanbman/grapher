name: Validate pocket-synth enrichment decisions

on:
  push:
    branches: [research/enrichment-workflow-v1]
    paths: ['.github/workflows/apply-enrichment-review.yml']

permissions:
  contents: write

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: grapher
      - uses: actions/checkout@v4
        with:
          repository: seanbman/pocket-synth
          ref: 33928620f31c70d86da9a4f9133aec897752f3f0
          path: pocket-synth
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compose accepted successors
        working-directory: grapher
        run: |
          python - <<'PY'
          import importlib.util, json
          from pathlib import Path

          p=Path('research/training-data/enrichment.py')
          spec=importlib.util.spec_from_file_location('enrichment',p)
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          graph=json.loads(Path('../pocket-synth/.grapher/knowledge.json').read_text())
          study=Path('research/training-data/enrichment-studies/001-pocket-synth')
          reviews=json.loads((study/'reviews.json').read_text())['reviews']
          accepted=[]; deferred=[]
          outdir=study/'accepted'; outdir.mkdir(exist_ok=True)
          for review in reviews:
              if review['action']=='defer':
                  deferred.append({'node_id':review['node_id'],'reason':review['reason']})
                  continue
              bundle=mod.compose_successor(
                  graph,
                  review['node_id'],
                  review['type'],
                  review['values'],
                  actor_id=review['actor_id'],
                  actor_kind=review['actor_kind'],
                  reason=review['reason'],
              )
              (outdir/f"{review['node_id']}.json").write_text(json.dumps(bundle,indent=2,sort_keys=True)+'\n')
              accepted.append({'node_id':review['node_id'],'successor_id':bundle['successor']['id'],'type':review['type']})
          result={'accepted_count':len(accepted),'deferred_count':len(deferred),'accepted':accepted,'deferred':deferred,'source_mutated':False}
          (study/'result.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          (study/'ASSESSMENT.md').write_text(
              '# Assessment\n\n'
              'Three legacy records were reviewed. Two supplied enough explicit meaning to produce validator-approved typed successor bundles; one remained deferred because required semantic meaning was absent. The source graph was not mutated.\n\n'
              'This demonstrates the intended boundary: preview suggests contracts, review supplies meaning, Grapher semantic validation gates the successor, and uncertain records remain legacy context.\n'
          )
          print(json.dumps(result,indent=2))
          PY
      - name: Commit results and remove runner
        working-directory: grapher
        run: |
          rm .github/workflows/apply-enrichment-review.yml
          git config user.name seanbman
          git config user.email seannicholasburman@gmail.com
          git add research/training-data/enrichment-studies/001-pocket-synth .github/workflows/apply-enrichment-review.yml
          git commit -m 'research: validate pocket-synth enrichment successors'
          git push
