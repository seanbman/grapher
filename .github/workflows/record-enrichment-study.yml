name: Record enrichment study

on:
  push:
    branches: [research/enrichment-workflow-v1]
    paths: ['.github/workflows/record-enrichment-study.yml']

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - name: Record and publish enrichment study
        run: |
          grapher sync --force
          grapher add \
            --id result-grapher-enrichment-study-001-20260905 \
            --type result \
            --title 'Legacy enrichment workflow validated on pocket-synth' \
            --content '{"result":"Review-first enrichment workflow 0.1.0 validated two explicitly supplied typed successors from a three-record pinned pocket-synth legacy slice while deferring one record with missing required meaning and leaving the source graph unchanged.","evidence":"research/training-data/enrichment-studies/001-pocket-synth/result.json records 2 accepted successors, 1 deferred record, and source_mutated=false; research CI validates the enrichment workflow and Grapher semantic contracts."}' \
            --status current \
            --verification verified \
            --evidence '{"type":"test","ref":"research/training-data/enrichment-studies/001-pocket-synth/result.json","summary":"Two successor bundles validated, one legacy instruction deferred, source graph not mutated."}' \
            --source-ref research/training-data/enrichment.py \
            --source-ref research/training-data/enrichment-studies/001-pocket-synth/result.json \
            --actor ChatGPT \
            --actor-kind agent \
            --role semantic-enricher
          grapher add \
            --id proposal-grapher-enrichment-promotion-study-20260905 \
            --type proposal \
            --title 'Test successor promotion on a disposable legacy graph copy' \
            --content '{"proposal":"Promote validated enrichment successor bundles into a disposable copy of the pinned pocket-synth legacy graph, preserve original records and derived_from lineage, then compare normalization and training-data exporter metrics before and after promotion.","rationale":"The workflow now validates successor creation without source mutation; the next unknown is whether inserting those successors into a graph copy preserves lineage and improves normalized export yield without corrupting truth state."}' \
            --status proposed \
            --verification unverified \
            --source-ref research/training-data/STUDY_LOG.md \
            --actor ChatGPT \
            --actor-kind agent \
            --role semantic-enricher
          grapher link proposal-grapher-enrichment-promotion-study-20260905 result-grapher-enrichment-study-001-20260905 --rel derived_from
          grapher validate
          grapher audit
          grapher publish
      - name: Commit publication and remove runner
        run: |
          rm .github/workflows/record-enrichment-study.yml
          git config user.name seanbman
          git config user.email seannicholasburman@gmail.com
          git add .grapher/shared .github/workflows/record-enrichment-study.yml
          git commit -m 'grapher: record enrichment study 001'
          git push
