name: Record legacy normalization study

on:
  push:
    paths:
      - '.github/workflows/record-legacy-normalization-study.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - name: Record and publish study result
        run: |
          grapher sync --force
          grapher add \
            --id result-legacy-normalization-study-001-20260905 \
            --type result \
            --title 'Legacy normalization study 001' \
            --status current \
            --verification verified \
            --content '{"result":"The pinned pocket-synth legacy graph contains 196 nodes: 80 require explicit semantic enrichment, 116 are context-only, and none can be safely auto-converted into current typed semantic records.","evidence":"Read-only normalization preview 0.1.0 classified every node without mutating the source; ambiguous findings, instruction, and free-text decision records were not auto-retyped."}' \
            --evidence '{"type":"file","ref":"research/training-data/normalization-studies/001-pocket-synth/metrics.json","summary":"Normalization preview counts and source commit anchor."}'
          grapher validate
          grapher publish
      - name: Commit publication and remove runner
        run: |
          rm .github/workflows/record-legacy-normalization-study.yml
          git config user.name 'grapher-research'
          git config user.email 'grapher-research@users.noreply.github.com'
          git add .grapher/shared .github/workflows/record-legacy-normalization-study.yml
          git commit -m 'grapher: record legacy normalization study 001'
          git push
