name: Release lock narrow

on:
  push:
    branches:
      - release/v0.6.0-integrity
    paths:
      - .github/workflows/release-lock-narrow.yml

permissions:
  contents: write

jobs:
  narrow-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.6.0-integrity
          fetch-depth: 0
      - name: Restore accepted lock and change only local package version
        run: |
          git fetch origin main
          git checkout origin/main -- uv.lock
          python - <<'PY'
          from pathlib import Path
          path = Path('uv.lock')
          text = path.read_text()
          old = '[[package]]\nname = "grapher"\nversion = "0.5.0"'
          new = '[[package]]\nname = "grapher"\nversion = "0.6.0"'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one Grapher 0.5.0 package block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit narrow lock correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uv.lock
          git commit -m 'release: align uv.lock package version with v0.6.0'
          git push origin HEAD:release/v0.6.0-integrity
