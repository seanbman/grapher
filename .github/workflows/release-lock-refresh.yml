name: Release lock refresh

on:
  push:
    branches:
      - release/v0.6.0-integrity
    paths:
      - .github/workflows/release-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.6.0-integrity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Refresh lockfile and verify release version
        run: |
          uv lock
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('uv.lock').read_text()
          match = re.search(r'\[\[package\]\]\nname = "grapher"\nversion = "([^"]+)"', text)
          if not match or match.group(1) != '0.6.0':
              raise SystemExit(f'expected grapher 0.6.0 in uv.lock, got {match.group(1) if match else "missing"}')
          PY
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- uv.lock; then
            echo 'uv.lock already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uv.lock
          git commit -m 'release: refresh uv.lock for v0.6.0'
          git push origin HEAD:release/v0.6.0-integrity
