name: Run Grapher v0.5.0 preparation

on:
  push:
    branches:
      - release/v0.5.0

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.5.0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update docs and version
        run: python .github/release_v050_update.py
      - name: Refresh lock and build metadata
        run: |
          python -m pip install uv build
          uv lock
          python -m pip install -e ".[dev]"
          python -m build
      - name: Run tests and verify packages
        run: |
          ./scripts/test.sh -v
          python -c "import grapher; assert grapher.__version__ == '0.5.0'"
          test -f dist/grapher-0.5.0.tar.gz
          ls dist/grapher-0.5.0-*.whl
          grep -q 'Version: 0.5.0' src/grapher.egg-info/PKG-INFO
      - name: Commit release preparation
        run: |
          rm -f .github/workflows/release-v050-prep.yml
          rm -f .github/workflows/release-v050-run.yml
          rm -f .github/release_v050_update.py
          rm -rf dist build
          git config user.name "grapher-release-bot"
          git config user.email "grapher-release-bot@users.noreply.github.com"
          git add -A
          git commit -m "release: prepare Grapher v0.5.0"
          git push origin HEAD:release/v0.5.0
