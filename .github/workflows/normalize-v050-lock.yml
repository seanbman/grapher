name: Normalize v0.5.0 lockfile

on:
  push:
    branches:
      - release/v0.5.0

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.5.0
          fetch-depth: 0
      - name: Restore lock format and bump only Grapher
        run: |
          git checkout origin/main -- uv.lock
          python -c "from pathlib import Path; p=Path('uv.lock'); s=p.read_text(); old='name = \"grapher\"\nversion = \"0.4.1\"'; assert old in s; p.write_text(s.replace(old, 'name = \"grapher\"\nversion = \"0.5.0\"', 1))"
          grep -A2 -B1 'name = "grapher"' uv.lock
      - name: Commit normalized lockfile
        run: |
          rm .github/workflows/normalize-v050-lock.yml
          git config user.name "grapher-release-bot"
          git config user.email "grapher-release-bot@users.noreply.github.com"
          git add uv.lock .github/workflows/normalize-v050-lock.yml
          git commit -m "chore: minimize v0.5.0 lockfile diff"
          git push origin HEAD:release/v0.5.0
